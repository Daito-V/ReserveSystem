<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body {
        color: #202124;
        font-family: Arial, sans-serif;
        margin: 24px;
      }

      main {
        max-width: 640px;
      }

      label {
        display: block;
        margin: 16px 0;
      }

      input,
      button {
        box-sizing: border-box;
        display: block;
        margin-top: 6px;
        padding: 9px;
        width: 100%;
      }

      button {
        cursor: pointer;
      }

      #message {
        margin-top: 16px;
        white-space: pre-wrap;
      }

      .error {
        color: #b3261e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>会議室の代理キャンセル</h1>
      <form id="cancelForm">
        <label>
          予約ID
          <input id="reservationId" type="number" step="1" required>
        </label>
        <label>
          実行者ID（総務部管理者）
          <input id="actorId" type="number" step="1" required>
        </label>
        <label>
          キャンセル理由
          <input id="reason" type="text" maxlength="200" required>
        </label>
        <button id="submitButton" type="submit">代理キャンセルする</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
    </main>

    <script>
      const form = document.getElementById('cancelForm');
      const message = document.getElementById('message');
      const submitButton = document.getElementById('submitButton');

      form.addEventListener('submit', event => {
        event.preventDefault();
        message.textContent = '';
        message.className = '';
        submitButton.disabled = true;

        const reservationId = document.getElementById('reservationId').value;
        const actorId = document.getElementById('actorId').value;
        const reason = document.getElementById('reason').value;

        google.script.run
          .withSuccessHandler(result => {
            message.textContent = result;
            submitButton.disabled = false;
          })
          .withFailureHandler(error => {
            message.textContent = error && error.message
              ? error.message
              : String(error);
            message.className = 'error';
            submitButton.disabled = false;
          })
          .cancelAsAdmin(reservationId, actorId, reason);
      });
    </script>
  </body>
</html>
