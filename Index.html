<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><style>
body{font-family:Arial,sans-serif;margin:24px;color:#202124}h1{font-size:24px}section{border:1px solid #dadce0;border-radius:8px;padding:16px;margin:16px 0}label{display:inline-block;margin:6px 12px 6px 0}input,select,button{padding:8px;margin-top:4px}button{cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}.canceled{text-decoration:line-through;color:#777}.message{margin:10px 0;color:#174ea6}.error{color:#b3261e}.hidden{display:none}
</style></head><body>
<h1>会議室予約システム</h1>
<section><h2>予約一覧</h2><label>日付 <input id="listDate" type="date"></label><button onclick="loadReservations()">表示</button><div id="listMessage" class="message"></div><div id="reservationList"></div></section>
<section><h2>予約登録</h2><label>会議室 <select id="room"></select></label><label>開始 <input id="start" type="datetime-local"></label><label>終了 <input id="end" type="datetime-local"></label><label>予約者 <select id="booker"></select></label><button onclick="createReservation()">予約する</button><div id="createMessage" class="message"></div></section>
<section><h2>キャンセル</h2><p>本人キャンセルは予約開始時刻の24時間前までです。代理キャンセルは総務部管理者が理由を入力してください。</p><label>予約ID <input id="cancelId" type="number"></label><label>実行者ID <select id="canceler"></select></label><label>理由 <input id="reason" maxlength="500"></label><button onclick="cancelOwn()">本人としてキャンセル</button><button onclick="cancelProxy()">代理キャンセル</button><div id="cancelMessage" class="message"></div></section>
<section><h2>予約詳細・キャンセル履歴</h2><label>予約ID <input id="detailId" type="number"></label><button onclick="loadHistory()">履歴を表示</button><div id="history"></div></section>
<script>
const byId=id=>document.getElementById(id); const errorText=e=>e&&e.message?e.message:String(e);
function call(name,args,ok,target){google.script.run.withSuccessHandler(ok).withFailureHandler(e=>{byId(target).textContent=errorText(e);byId(target).className='message error'})[name](...args)}
function init(){const d=new Date();byId('listDate').value=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');google.script.run.withSuccessHandler(data=>{byId('room').innerHTML=data.rooms.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');const opts=data.users.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.id})</option>`).join('');byId('booker').innerHTML=opts;byId('canceler').innerHTML=opts}).withFailureHandler(e=>{byId('createMessage').textContent=errorText(e)}).getInitialData();loadReservations()}
function loadReservations(){byId('listMessage').textContent='';call('getReservations',[byId('listDate').value],rows=>{if(!rows.length){byId('reservationList').innerHTML='<b>この日に予約されている会議室はありません。</b>';return}byId('reservationList').innerHTML='<table><thead><tr><th>会議室</th><th>開始</th><th>終了</th><th>予約者</th><th>状態</th><th>予約ID</th></tr></thead><tbody>'+rows.map(r=>`<tr class="${['CANCELED','AUTO_CANCELED'].includes(r.status)?'canceled':''}"><td>${esc(r.room_name)}</td><td>${fmt(r.start_at)}</td><td>${fmt(r.end_at)}</td><td>${esc(r.user_name)}</td><td>${esc(r.status_label)}</td><td>${r.id}</td></tr>`).join('')+'</tbody></table>'},'listMessage')}
function createReservation(){byId('createMessage').className='message';call('createReservation',[{room_id:byId('room').value,start_at:byId('start').value,end_at:byId('end').value,user_id:byId('booker').value}],r=>{byId('createMessage').textContent=`${r.message} 予約ID: ${r.id}`;byId('cancelId').value=r.id;byId('detailId').value=r.id;loadReservations()},'createMessage')}
function cancelOwn(){call('cancelOwnReservation',[byId('cancelId').value,byId('canceler').value,byId('reason').value],m=>{byId('cancelMessage').textContent=m;loadReservations();byId('detailId').value=byId('cancelId').value;loadHistory()},'cancelMessage')}
function cancelProxy(){call('cancelAsAdmin',[byId('cancelId').value,byId('canceler').value,byId('reason').value],m=>{byId('cancelMessage').textContent=m;loadReservations();byId('detailId').value=byId('cancelId').value;loadHistory()},'cancelMessage')}
function loadHistory(){call('getCancellationHistory',[byId('detailId').value],rows=>{byId('history').innerHTML=rows.length?'<ul>'+rows.map(r=>`<li>${esc(r.canceled_by_name)} (${r.canceled_by}) / ${fmt(r.canceled_at)} / ${r.is_proxy?'代理':'本人'} / ${esc(r.reason)}</li>`).join('')+'</ul>':'キャンセル履歴はありません。'},'history')}
function fmt(v){return v?new Date(v).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}):''}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
