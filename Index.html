<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937;background:#f4f6f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:30px 24px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#173e35;color:white;font-size:21px}.eyebrow{font-size:11px;letter-spacing:.14em;color:#77827d;font-weight:700}.title{margin:3px 0 0;font-size:22px;letter-spacing:.02em}.identity{display:flex;align-items:center;gap:10px;color:#68736f;font-size:13px}.identity select,select,input,textarea{font:inherit}.identity select,.field input,.field select,.field textarea{border:1px solid #dce2df;border-radius:9px;background:white;padding:10px 12px;color:#26332e}.panel{background:#fff;border:1px solid #e6eae8;border-radius:15px;box-shadow:0 4px 18px #26332e08}.toolbar{padding:18px 20px;display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px}.date-wrap{display:flex;align-items:end;gap:12px}.field{display:grid;gap:6px;font-size:12px;color:#6d7873}.field input,.field select{height:40px;min-width:150px}.btn{border:0;border-radius:9px;background:#173e35;color:white;padding:11px 16px;font-weight:650;cursor:pointer}.btn:hover{background:#24584b}.btn.secondary{background:#edf2ef;color:#24443a}.btn.ghost{background:transparent;color:#476157;padding:7px 9px}.btn:disabled{opacity:.55;cursor:wait}.count{font-size:13px;color:#84908b}.room-block{margin:16px 0;overflow:hidden}.room-head{padding:16px 20px;border-bottom:1px solid #edf0ef;display:flex;justify-content:space-between;align-items:center}.room-name{font-size:15px;font-weight:700}.room-cap{font-size:12px;color:#84908b}.booking{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f2f1}.booking:last-child{border-bottom:0}.time{font-weight:700;font-variant-numeric:tabular-nums}.booking-meta{font-size:13px;color:#63716b}.booking-meta b{color:#27332e;font-weight:600}.status{display:inline-flex;margin-left:8px;border-radius:99px;background:#eaf3ef;color:#34705d;padding:4px 9px;font-size:11px;font-weight:650}.status.cancel{background:#f1f2f2;color:#828986}.canceled .booking-main{text-decoration:line-through;color:#929a96}.empty{padding:58px 20px;text-align:center;color:#78847e}.empty-icon{font-size:28px;margin-bottom:10px}.modal-back{position:fixed;inset:0;background:#15251f70;display:grid;place-items:center;padding:16px;z-index:2}.modal{width:min(520px,100%);padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.detail-list{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:14px}.detail-list dt{color:#84908b}.detail-list dd{margin:0}.notice{padding:12px 14px;border-radius:9px;background:#f4f7f5;font-size:13px;line-height:1.7;margin-top:16px}.error{color:#a33131;font-size:13px;margin-top:12px}.hidden{display:none!important}.loading{padding:40px;text-align:center;color:#89938f}
    @media(max-width:650px){.shell{padding:20px 14px 40px}.top{align-items:flex-start;flex-direction:column}.identity{width:100%;justify-content:space-between}.toolbar{align-items:flex-start;flex-direction:column}.date-wrap{width:100%}.field input{min-width:0}.booking{grid-template-columns:1fr auto;gap:7px}.time{grid-column:1}.booking-main{grid-column:1/-1;grid-row:2}.booking-actions{grid-column:2;grid-row:1}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.room-head{padding:14px}.booking{padding:14px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><div class="logo">⌂</div><div><div class="eyebrow">WORKPLACE / FACILITIES</div><h1 class="title">会議室予約</h1></div></div>
    <div class="identity"><span>利用者 ID</span><select id="actor"></select><button class="btn" onclick="openCreate()">＋ 予約を登録</button></div>
  </header>
  <section class="panel toolbar"><div class="date-wrap"><label class="field">表示する日付<input id="date" type="date"></label><button class="btn secondary" onclick="loadReservations()">表示</button></div><span class="count" id="count"></span></section>
  <section id="list" class="loading">読み込み中…</section>
</main>
<div id="modalRoot"></div>
<script>
  let rooms=[], users=[], reservations=[];
  const $=id=>document.getElementById(id);
  const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const actor=()=>users.find(u=>Number(u.id)===Number($('actor').value));
  function boot(){ $('date').value=localToday(); google.script.run.withSuccessHandler(data=>{rooms=data.rooms;users=data.users;$('actor').innerHTML=users.map(u=>`<option value="${u.id}">${esc(u.name)}（${u.role==='ADMIN'?'総務管理者':'社員'}）</option>`).join('');loadReservations();}).withFailureHandler(showFatal).getInitialData(); }
  function loadReservations(){ $('list').innerHTML='<div class="panel loading">読み込み中…</div>';google.script.run.withSuccessHandler(rows=>{reservations=rows;render();}).withFailureHandler(showFatal).listReservations($('date').value); }
  function render(){ $('count').textContent=`${reservations.length} 件`;if(!reservations.length){$('list').innerHTML='<div class="panel empty"><div class="empty-icon">▦</div>この日に予約されている会議室はありません。</div>';return;}
    $('list').innerHTML=rooms.map(room=>{const rows=reservations.filter(r=>Number(r.room_id)===Number(room.id));if(!rows.length)return '';return `<section class="panel room-block"><div class="room-head"><span class="room-name">${esc(room.name)}</span><span class="room-cap">定員 ${esc(room.capacity)} 名</span></div>${rows.map(bookingHtml).join('')}</section>`;}).join(''); }
  function bookingHtml(r){const canceled=['CANCELED','AUTO_CANCELED'].includes(r.status);const start=new Date(r.start_at),end=new Date(r.end_at);const times=`${fmtTime(start)} – ${fmtTime(end)}`;const own=Number(actor()?.id)===Number(r.user_id);const admin=actor()?.role==='ADMIN';const proxy=admin&&!own;const canCancel=own&&start-Date.now()>=86400000||proxy;return `<article class="booking ${canceled?'canceled':''}"><div class="time">${times}</div><div class="booking-main"><span><b>${esc(r.user_name)}</b></span><span class="status ${canceled?'cancel':''}">${esc(r.status_label)}</span></div><div class="booking-actions"><button class="btn ghost" onclick="showDetail(${Number(r.id)})">詳細</button>${r.status==='BOOKED'&&canCancel?`<button class="btn ghost" onclick="cancelDialog(${Number(r.id)},${proxy})">キャンセル</button>`:''}</div></article>`;}
  function fmtTime(d){return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
  function openCreate(){const date=$('date').value||localToday();$('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="panel modal"><div class="modal-head"><h2>会議室を予約</h2><button class="btn ghost" onclick="closeModal()">閉じる</button></div><div class="form-grid"><label class="field">会議室<select id="roomInput">${rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></label><label class="field">予約者<select id="userInput">${users.map(u=>`<option value="${u.id}" ${Number(u.id)===Number(actor()?.id)?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label><label class="field">開始日時<input id="startInput" type="datetime-local" value="${date}T09:00"></label><label class="field">終了日時<input id="endInput" type="datetime-local" value="${date}T10:00"></label><div id="formError" class="error full"></div></div><div class="actions"><button class="btn secondary" onclick="closeModal()">戻る</button><button class="btn" onclick="submitCreate(this)">予約を確定</button></div></section></div>`;}
  function submitCreate(button){button.disabled=true;const payload={room_id:$('roomInput').value,user_id:$('userInput').value,start_at:new Date($('startInput').value).toISOString(),end_at:new Date($('endInput').value).toISOString()};google.script.run.withSuccessHandler(result=>{button.disabled=false;if(!result.ok){$('formError').textContent=result.message;return;}closeModal();$('date').value=payload.start_at.slice(0,10);loadReservations();}).withFailureHandler(e=>{$('formError').textContent=e.message;button.disabled=false;}).createReservation(payload);}
  function cancelDialog(id,isProxy){const r=reservations.find(x=>Number(x.id)===id);$('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="panel modal"><div class="modal-head"><h2>${isProxy?'代理キャンセル':'予約をキャンセル'}</h2><button class="btn ghost" onclick="closeModal()">閉じる</button></div><div class="notice">${esc(r.room_name)}・${fmtTime(new Date(r.start_at))} – ${fmtTime(new Date(r.end_at))}<br>${esc(r.user_name)} の予約をキャンセルします。</div><label class="field" style="margin-top:16px">${isProxy?'理由（必須）':'理由（任意）'}<textarea id="reasonInput" rows="3" maxlength="200" placeholder="${isProxy?'理由を入力してください':'理由があれば入力してください'}"></textarea></label><div id="formError" class="error"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">戻る</button><button class="btn" onclick="submitCancel(${id},${isProxy},this)">キャンセルを確定</button></div></section></div>`;}
  function submitCancel(id,isProxy,button){button.disabled=true;const fn=isProxy?'proxyCancel':'cancelOwn';google.script.run.withSuccessHandler(result=>{button.disabled=false;if(!result.ok){$('formError').textContent=result.message;return;}closeModal();loadReservations();}).withFailureHandler(e=>{$('formError').textContent=e.message;button.disabled=false;})[fn](id,actor().id,$('reasonInput').value);}
  function showDetail(id){google.script.run.withSuccessHandler(d=>{if(!d)return;const c=d.cancellation;$('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="panel modal"><div class="modal-head"><h2>予約の詳細</h2><button class="btn ghost" onclick="closeModal()">閉じる</button></div><dl class="detail-list"><dt>会議室</dt><dd>${esc(d.room_name)}</dd><dt>予約者</dt><dd>${esc(d.user_name)}</dd><dt>日時</dt><dd>${new Date(d.start_at).toLocaleString('ja-JP',{dateStyle:'medium',timeStyle:'short'})} – ${fmtTime(new Date(d.end_at))}</dd><dt>状態</dt><dd>${esc(d.status_label)}</dd></dl>${c?`<div class="notice"><b>キャンセル履歴</b><br>実行者：${esc(c.canceled_by_name)}（${c.is_proxy?'代理':'本人'}）<br>実行日時：${new Date(c.canceled_at).toLocaleString('ja-JP')}<br>理由：${esc(c.reason||'（理由の記載なし）')}</div>`:''}</section></div>`;}).getReservationDetail(id);}
  function closeModal(){$('modalRoot').innerHTML='';}function showFatal(e){$('list').innerHTML=`<div class="panel empty">${esc(e.message||e)}</div>`;}boot();
</script>
</body>
</html>
